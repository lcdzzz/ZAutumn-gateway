# Local demo only: no persistent volume, no production credentials.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
